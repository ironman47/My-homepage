<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Native Safari EPUB Reader</title><script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script><style>:root{--bg:#f5f5f7;--panel:#fff;--text:#2d2d2d;--muted:#666;--border:#dfdfdf;--hover:#f0f0f5;--primary:#007aff;--primary-hover:#0057b8;--shadow:0 2px 10px rgba(0,0,0,.05)}[data-theme="dark"]{--bg:#111213;--panel:#1a1b1d;--text:#e7e7e7;--muted:#a0a0a0;--border:#2f3033;--hover:#2a2b2f;--primary:#0a84ff;--primary-hover:#2b95ff;--shadow:0 2px 12px rgba(0,0,0,.35)}*{box-sizing:border-box}html,body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","맑은 고딕",sans-serif}body{display:flex;flex-direction:column;overflow:hidden}header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 18px;background:var(--panel);border-bottom:1px solid var(--border);box-shadow:var(--shadow);z-index:2}.title{font-weight:700;margin-left:8px}input[type="file"],select,button{font:inherit}select{padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:var(--panel);color:var(--text)}button{padding:10px 16px;border:none;border-radius:8px;background:var(--primary);color:#fff;cursor:pointer;transition:background .18s ease,opacity .18s ease}button:hover{background:var(--primary-hover)}button:disabled{opacity:.45;cursor:not-allowed}#theme-toggle{background:transparent;color:var(--text);border:1px solid var(--border)}#theme-toggle:hover{background:var(--hover)}.layout{flex:1;display:flex;min-height:0;overflow:hidden}aside{width:280px;flex:0 0 280px;background:var(--panel);border-right:1px solid var(--border);padding:16px;overflow:auto;min-height:0}aside h3{margin:0 0 12px;font-size:1rem;color:var(--muted)}#toc-list{list-style:none;padding:0;margin:0}#toc-list li{padding:8px 10px;margin-bottom:6px;border-radius:6px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.95rem}#toc-list li:hover{background:var(--hover);color:var(--primary)}#toc-list li.active{background:var(--hover);font-weight:700}main{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;padding:18px;overflow:hidden}#viewer{position:relative;flex:1;min-height:0;border:1px solid var(--border);border-radius:10px;background:var(--panel);overflow:hidden;box-shadow:var(--shadow)}#loading-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:var(--panel);z-index:5}.spinner{width:32px;height:32px;border-radius:50%;border:4px solid var(--border);border-top-color:var(--primary);animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}#chapter-frame{width:100%;height:100%;border:0;display:block;background:var(--panel)}.nav-buttons{display:flex;justify-content:center;gap:10px;margin-top:14px}.hidden{display:none !important}#focus-toggle{position:fixed;right:22px;bottom:22px;z-index:1000;opacity:.7;background:#222;border:0;border-radius:999px;color:#fff;padding:10px 16px;box-shadow:0 6px 18px rgba(0,0,0,.18)}#focus-toggle:hover{opacity:1}</style></head><body><header id="main-header"><input type="file" id="file-picker" accept=".epub"><select id="lang-selector" title="Safari recognition language"><option value="ko" selected>Korean (KR)</option><option value="ja">Japanese (JP)</option><option value="en">English (EN)</option><option value="zh-CN">Chinese (Simplified)</option><option value="zh-TW">Chinese (Traditional)</option></select><button id="theme-toggle">🌙 Dark Mode</button><span id="book-title" class="title">Please select a local book file...</span></header><div class="layout"><aside id="sidebar"><h3>Table of Contents</h3><ul id="toc-list"><li style="color:var(--muted);cursor:default;">Upload an EPUB file to view content links.</li></ul></aside><main><div id="viewer"><div id="loading-overlay" class="hidden"><div class="spinner"></div><div id="loading-text">Loading Book...</div></div></div><div class="nav-buttons" id="bottom-nav"><button id="prev-btn" disabled>◀ Previous</button><button id="next-btn" disabled>Next ▶</button></div></main></div><button id="focus-toggle">Toggle Reading Mode</button><script>let zip=null,spine=[],manifest={},toc=[],basePath='';let chapterIndex=0,currentLang='ko',darkMode=false;let state={iframe:null,currentPage:0,maxPages:1,pageWidth:0,resizeTimer:null};const viewer=document.getElementById('viewer'),overlay=document.getElementById('loading-overlay'),overlayText=document.getElementById('loading-text'),tocList=document.getElementById('toc-list'),prevBtn=document.getElementById('prev-btn'),nextBtn=document.getElementById('next-btn');function resolvePath(base,relative){if(!base)return relative;const stack=base.split('/').filter(Boolean);for(const p of relative.split('/')){if(p==='..')stack.pop();else if(p!=='.'&&p!=='')stack.push(p)}return stack.join('/')}function viewerSize(){return{w:Math.max(1,viewer.clientWidth),h:Math.max(1,viewer.clientHeight)}}function updateButtons(){prevBtn.disabled=(chapterIndex===0&&state.currentPage===0);nextBtn.disabled=(chapterIndex===spine.length-1&&state.currentPage>=state.maxPages-1)}function sendToFrame(message){if(state.iframe&&state.iframe.contentWindow)state.iframe.contentWindow.postMessage(message,'*')}function rebuildToc(){tocList.innerHTML='';toc.forEach(item=>{const li=document.createElement('li');li.textContent=item.label.trim();li.onclick=()=>{const target=item.href.split('#')[0];const idx=spine.findIndex(s=>s===target||target.endsWith(s));if(idx>=0){chapterIndex=idx;renderChapter()}};tocList.appendChild(li)})}async function readText(path){const f=zip.file(path);return f?await f.async('text'):null}async function processHtml(html,chapterHref){const chapterDir=chapterHref.includes('/')?chapterHref.slice(0,chapterHref.lastIndexOf('/')+1):'';let body=(html.match(/<body[^>]*>([\s\S]*?)<\/body>/i)||[null,html])[1];const styles=[];for(const m of html.matchAll(/<style[^>]*>([\s\S]*?)<\/style>/gi))styles.push(m[1]);for(const m of html.matchAll(/<link[^>]+href=["']([^"']+)["']/gi)){const href=m[1];if(href.includes('://')||href.startsWith('data:'))continue;const css=await readText(resolvePath(chapterDir,href));if(css)styles.push(css)}for(const src of new Set([...body.matchAll(/<img[^>]+src=["']([^"']+)["']/gi)].map(m=>m[1]))){if(src.includes('://')||src.startsWith('data:'))continue;const full=resolvePath(chapterDir,src);const f=zip.file(full);if(!f)continue;const b64=await f.async('base64');const ext=full.split('.').pop().toLowerCase();let mime='image/png';if(ext==='jpg'||ext==='jpeg')mime='image/jpeg';else if(ext==='svg')mime='image/svg+xml';else if(ext==='gif')mime='image/gif';body=body.split(src).join(`data:${mime};base64,${b64}`)}return{body,css:styles.join('\n')}}async function loadBook(file){overlay.classList.remove('hidden');overlayText.textContent='Unzipping EPUB...';const arrayBuffer=await file.arrayBuffer();zip=await JSZip.loadAsync(arrayBuffer);const parser=new DOMParser();overlayText.textContent='Reading package...';const containerXml=await zip.file('META-INF/container.xml').async('text');const containerDoc=parser.parseFromString(containerXml,'text/xml');const opfPath=containerDoc.querySelector('rootfile').getAttribute('full-path');basePath=opfPath.includes('/')?opfPath.slice(0,opfPath.lastIndexOf('/')+1):'';const opfXml=await zip.file(opfPath).async('text');const opfDoc=parser.parseFromString(opfXml,'text/xml');const titleNode=opfDoc.getElementsByTagName('dc:title')[0];document.getElementById('book-title').textContent=titleNode?titleNode.textContent:file.name;manifest={};let ncxHref=null;[...opfDoc.getElementsByTagName('item')].forEach(item=>{const id=item.getAttribute('id'),href=item.getAttribute('href'),mediaType=item.getAttribute('media-type');manifest[id]=href;if(mediaType==='application/x-dtbncx+xml')ncxHref=href});spine=[];[...opfDoc.getElementsByTagName('itemref')].forEach(ref=>{const idref=ref.getAttribute('idref');if(manifest[idref])spine.push(manifest[idref])});toc=[];if(ncxHref){try{const ncxPath=resolvePath(basePath,ncxHref);const ncxText=await readText(ncxPath);if(ncxText){const ncxDoc=parser.parseFromString(ncxText,'text/xml');[...ncxDoc.getElementsByTagName('navPoint')].forEach(np=>{const labelNode=np.getElementsByTagName('text')[0],contentNode=np.getElementsByTagName('content')[0];if(labelNode&&contentNode)toc.push({label:labelNode.textContent,href:contentNode.getAttribute('src')})})}}catch(err){console.warn('TOC parse failed',err)}}if(!toc.length)spine.forEach((href,i)=>toc.push({label:'Chapter '+(i+1),href}));rebuildToc();chapterIndex=0;await renderChapter()}async function renderChapter(){if(!zip||!spine.length)return;overlay.classList.remove('hidden');overlayText.textContent='Rendering Chapter...';const chapterHref=spine[chapterIndex];const chapterPath=resolvePath(basePath,chapterHref);const file=zip.file(chapterPath);if(!file){overlayText.textContent='Chapter not found in archive.';return}const rawHtml=await file.async('text');const processed=await processHtml(rawHtml,chapterPath);state.currentPage=0;state.maxPages=1;state.pageWidth=viewerSize().w;const fontColor=darkMode?'#e0e0e0':'#333333';const bgColor=darkMode?'#1a1b1d':'#ffffff';const linkColor=darkMode?'#5dade2':'#0056b3';const safeCss=processed.css.replace(/`/g,'\\`');const safeBody=processed.body.replace(/`/g,'\\`');const frameDoc='<!DOCTYPE html><html lang="'+currentLang+'"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:'+bgColor+';}body{-webkit-locale:\''+currentLang+'\';font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif;color:'+fontColor+';}#viewport{width:100vw;height:100vh;overflow:hidden;position:relative;background:'+bgColor+';}#content{height:100%;overflow:hidden;will-change:transform;padding:20px;column-gap:0;column-fill:auto;}img,svg,video,canvas{max-width:100% !important;height:auto !important;}a{color:'+linkColor+';}'+safeCss+'</style></head><body><div id="viewport"><div id="content">'+safeBody+'</div></div><script>(
