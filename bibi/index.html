<!DOCTYPE html>
<html lang="ko"> <!-- Outer trigger for Safari -->
<head>
    <title>Korean EPUB Reader</title>
    <style>
        html, body, iframe { margin: 0; padding: 0; width: 100%; height: 100%; border: none; overflow: hidden; }
    </style>
</head>
<body>

    <!-- Point this src to wherever your bibi index.html is located -->
    <iframe id="bibi-frame" src="bibi/index.html"></iframe>

    <script>
        // Forces Safari's localization engine down into the frame context
        const iframe = document.getElementById('bibi-frame');
        iframe.onload = function() {
            try {
                const innerDoc = iframe.contentDocument || iframe.contentWindow.document;
                innerDoc.documentElement.setAttribute('lang', 'ko');
                innerDoc.body.setAttribute('lang', 'ko');
            } catch(e) {
                console.log("Cross-origin restriction or frame loading block.");
            }
        };
    </script>
</body>
</html>
