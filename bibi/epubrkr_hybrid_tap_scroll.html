<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
<title>Native Safari EPUB Reader Hybrid</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--bg:#f5f5f7;--panel:#fff;--text:#2d2d2d;--muted:#666;--border:#dfdfdf;--hover:#f0f0f5;--primary:#007aff;--primary-hover:#0057b8;--shadow:0 2px 10px rgba(0,0,0,.05)}
[data-theme="dark"]{--bg:#111213;--panel:#1a1b1d;--text:#e7e7e7;--muted:#a0a0a0;--border:#2f3033;--hover:#2a2b2f;--primary:#0a84ff;--primary-hover:#2b95ff;--shadow:0 2px 12px rgba(0,0,0,.35)}
*{box-sizing:border-box}html,body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","맑은 고딕",sans-serif}body{display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 18px;background:var(--panel);border-bottom:1px solid var(--border);box-shadow:var(--shadow);z-index:2}.title{font-weight:700;margin-left:8px}
input[type="file"],select,button{font:inherit}select{padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:var(--panel);color:var(--text)}button{padding:10px 16px;border:none;border-radius:8px;background:var(--primary);color:#fff;cursor:pointer;transition:background .18s ease,opacity .18s ease}button:hover{background:var(--primary-hover)}button:disabled{opacity:.45;cursor:not-allowed}#theme-toggle,#mode-toggle{background:transparent;color:var(--text);border:1px solid var(--border)}#theme-toggle:hover,#mode-toggle:hover{background:var(--hover)}.layout{flex:1;display:flex;min-height:0;overflow:hidden}aside{width:280px;flex:0 0 280px;background:var(--panel);border-right:1px solid var(--border);padding:16px;overflow:auto;min-height:0}aside h3{margin:0 0 12px;font-size:1rem;color:var(--muted)}#toc-list{list-style:none;padding:0;margin:0}#toc-list li{padding:8px 10px;margin-bottom:6px;border-radius:6px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.95rem}#toc-list li:hover{background:var(--hover);color:var(--primary)}#toc-list li.active{background:var(--hover);font-weight:700}main{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;padding:18px;overflow:hidden}#viewer{position:relative;flex:1;min-height:0;border:1px solid var(--border);border-radius:10px;background:var(--panel);overflow:auto;box-shadow:var(--shadow);-webkit-overflow-scrolling:touch}#loading-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:var(--panel);z-index:5}.spinner{width:32px;height:32px;border-radius:50%;border:4px solid var(--border);border-top-color:var(--primary);animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}#chapter-content{padding:20px 20px 40px;max-width:100%;min-height:100%;line-height:1.75;font-size:18px;word-break:break-word;overflow-wrap:anywhere}#chapter-content img,#chapter-content svg,#chapter-content video,#chapter-content canvas{max-width:100% !important;height:auto !important}#chapter-content iframe{max-width:100% !important}#chapter-content a{color:var(--primary)}.nav-buttons{display:flex;justify-content:center;gap:10px;margin-top:14px}.hidden{display:none !important}#focus-toggle{position:fixed;right:22px;bottom:22px;z-index:1000;opacity:.7;background:#222;border:0;border-radius:999px;color:#fff;padding:10px 16px;box-shadow:0 6px 18px rgba(0,0,0,.18)}#focus-toggle:hover{opacity:1}#status{font-size:.88rem;color:var(--muted);margin-left:6px}
</style>
</head>
<body>
<header id="main-header"><input type="file" id="file-picker" accept=".epub"><select id="lang-selector" title="Safari recognition language"><option value="ko" selected>Korean (KR)</option><option value="ja">Japanese (JP)</option><option value="en">English (EN)</option><option value="zh-CN">Chinese (Simplified)</option><option value="zh-TW">Chinese (Traditional)</option></select><button id="theme-toggle">🌙 Dark Mode</button><button id="mode-toggle">Scroll Mode</button><span id="book-title" class="title">Please select a local book file...</span><span id="status"></span></header>
<div class="layout"><aside id="sidebar"><h3>Table of Contents</h3><ul id="toc-list"><li style="color:var(--muted);cursor:default;">Upload an EPUB file to view content links.</li></ul></aside><main><div id="viewer"><div id="loading-overlay" class="hidden"><div class="spinner"></div><div id="loading-text">Loading Book...</div></div><div id="chapter-content"></div></div><div class="nav-buttons" id="bottom-nav"><button id="prev-btn" disabled>◀ Previous</button><button id="next-btn" disabled>Next ▶</button></div></main></div>
<button id="focus-toggle">Toggle Reading Mode</button>
<script>
let zip=null,spine=[],manifest={},toc=[],basePath='';
let chapterIndex=0,currentLang='ko',darkMode=false,mode='scroll';
let state={currentPage:0,maxPages:1,pageWidth:0,resizeTimer:null,loaded:false,touchStartY:0,touchStartX:0};
const viewer=document.getElementById('viewer');
const overlay=document.getElementById('loading-overlay');
const overlayText=document.getElementById('loading-text');
const tocList=document.getElementById('toc-list');
const chapterContent=document.getElementById('chapter-content');
const prevBtn=document.getElementById('prev-btn');
const nextBtn=document.getElementById('next-btn');
const statusEl=document.getElementById('status');
function resolvePath(base,relative){if(!base)return relative;const stack=base.split('/').filter(Boolean);for(const p of relative.split('/')){if(p==='..')stack.pop();else if(p!=='.'&&p!=='')stack.push(p)}return stack.join('/')}
function viewerSize(){return{w:Math.max(1,viewer.clientWidth),h:Math.max(1,viewer.clientHeight)}}
function setButtons(){prevBtn.disabled=(chapterIndex===0&&state.currentPage===0);nextBtn.disabled=(chapterIndex===spine.length-1&&state.currentPage>=state.maxPages-1);document.getElementById('mode-toggle').textContent=mode==='scroll'?'Scroll Mode':'Page Mode'}
function rebuildToc(){tocList.innerHTML='';toc.forEach(item=>{const li=document.createElement('li');li.textContent=item.label.trim();li.onclick=()=>{const target=item.href.split('#')[0];const idx=spine.findIndex(s=>s===target||target.endsWith(s));if(idx>=0){chapterIndex=idx;renderChapter()}};tocList.appendChild(li)})}
async function readText(path){const f=zip.file(path);return f?await f.async('text'):null}
function sanitizeHtml(html){return html.replace(/<script[\s\S]*?<\/script>/gi,'').replace(/on\w+\s*=\s*"[^"]*"/gi,'').replace(/on\w+\s*=\s*'[^']*'/gi,'')}
function extractBody(html){return(html.match(/<body[^>]*>([\s\S]*?)<\/body>/i)||[null,html])[1]}
function normalizeCss(css){return css.replace(/@page[\s\S]*?\}/gi,'').replace(/position\s*:\s*(fixed|absolute)\s*;/gi,'position:static;').replace(/transform\s*:[^;]+;/gi,'').replace(/overflow\s*:\s*(hidden|scroll|auto)\s*;/gi,'overflow:visible;').replace(/display\s*:\s*(grid|flex)\s*;/gi,'display:block;').replace(/column-[^:]+:[^;]+;/gi,'').replace(/columns?\s*:[^;]+;/gi,'')}
async function processHtml(html,chapterHref){const chapterDir=chapterHref.includes('/')?chapterHref.slice(0,chapterHref.lastIndexOf('/')+1):'';let body=sanitizeHtml(extractBody(html));const styles=[];for(const m of html.matchAll(/<style[^>]*>([\s\S]*?)<\/style>/gi))styles.push(normalizeCss(m[1]));for(const m of html.matchAll(/<link[^>]+href=["']([^"']+)["']/gi)){const href=m[1];if(href.includes('://')||href.startsWith('data:'))continue;const css=await readText(resolvePath(chapterDir,href));if(css)styles.push(normalizeCss(css))}for(const src of new Set([...body.matchAll(/<img[^>]+src=["']([^"']+)["']/gi)].map(m=>m[1]))){if(src.includes('://')||src.startsWith('data:'))continue;const full=resolvePath(chapterDir,src);const f=zip.file(full);if(!f)continue;const b64=await f.async('base64');const ext=full.split('.').pop().toLowerCase();let mime='image/png';if(ext==='jpg'||ext==='jpeg')mime='image/jpeg';else if(ext==='svg')mime='image/svg+xml';else if(ext==='gif')mime='image/gif';body=body.split(src).join(`data:${mime};base64,${b64}`)}return{body,css:styles.join('\n')}}
async function loadBook(file){overlay.classList.remove('hidden');overlayText.textContent='Unzipping EPUB...';state.loaded=false;chapterIndex=0;state.currentPage=0;state.maxPages=1;state.pageWidth=0;const arrayBuffer=await file.arrayBuffer();zip=await JSZip.loadAsync(arrayBuffer);const parser=new DOMParser();overlayText.textContent='Reading package...';const containerXml=await zip.file('META-INF/container.xml').async('text');const containerDoc=parser.parseFromString(containerXml,'text/xml');const opfPath=containerDoc.querySelector('rootfile').getAttribute('full-path');basePath=opfPath.includes('/')?opfPath.slice(0,opfPath.lastIndexOf('/')+1):'';const opfXml=await zip.file(opfPath).async('text');const opfDoc=parser.parseFromString(opfXml,'text/xml');const titleNode=opfDoc.getElementsByTagName('dc:title')[0];document.getElementById('book-title').textContent=titleNode?titleNode.textContent:file.name;manifest={};let ncxHref=null;[...opfDoc.getElementsByTagName('item')].forEach(item=>{const id=item.getAttribute('id'),href=item.getAttribute('href'),mediaType=item.getAttribute('media-type');manifest[id]=href;if(mediaType==='application/x-dtbncx+xml')ncxHref=href});spine=[];[...opfDoc.getElementsByTagName('itemref')].forEach(ref=>{const idref=ref.getAttribute('idref');if(manifest[idref])spine.push(manifest[idref])});toc=[];if(ncxHref){try{const ncxPath=resolvePath(basePath,ncxHref);const ncxText=await readText(ncxPath);if(ncxText){const ncxDoc=parser.parseFromString(ncxText,'text/xml');[...ncxDoc.getElementsByTagName('navPoint')].forEach(np=>{const labelNode=np.getElementsByTagName('text')[0],contentNode=np.getElementsByTagName('content')[0];if(labelNode&&contentNode)toc.push({label:labelNode.textContent,href:contentNode.getAttribute('src')})})}}catch(err){console.warn('TOC parse failed',err)}}if(!toc.length)spine.forEach((href,i)=>toc.push({label:'Chapter '+(i+1),href}));rebuildToc();statusEl.textContent='';await renderChapter()}
function updatePagination(){const pageHeight=viewer.clientHeight-40;const totalHeight=chapterContent.scrollHeight;state.maxPages=Math.max(1,Math.ceil(totalHeight/pageHeight));if(state.currentPage>state.maxPages-1)state.currentPage=state.maxPages-1;setButtons()}
function scrollToPage(page){const pageHeight=viewer.clientHeight-40;viewer.scrollTo({top:page*pageHeight,behavior:'instant'});state.currentPage=page;updatePagination()}
async function renderChapter(){if(!zip||!spine.length)return;overlay.classList.remove('hidden');overlayText.textContent='Rendering Chapter...';const chapterHref=spine[chapterIndex];const chapterPath=resolvePath(basePath,chapterHref);const file=zip.file(chapterPath);if(!file){overlayText.textContent='Chapter not found in archive.';return}const rawHtml=await file.async('text');const processed=await processHtml(rawHtml,chapterPath);const fontColor=darkMode?'#e0e0e0':'#333333';const bgColor=darkMode?'#1a1b1d':'#ffffff';const linkColor=darkMode?'#5dade2':'#0056b3';const html=`<div class="chapter-wrap" style="background:${bgColor};color:${fontColor};"><style>html,body{margin:0;padding:0} .chapter-wrap{padding:20px 20px 40px;min-height:100%;line-height:1.75;font-size:18px;word-break:break-word;overflow-wrap:anywhere;background:${bgColor};color:${fontColor};} .chapter-wrap *{max-width:100%;} .chapter-wrap a{color:${linkColor};} .chapter-wrap img, .chapter-wrap svg, .chapter-wrap video, .chapter-wrap canvas{max-width:100% !important;height:auto !important;} ${mode==='scroll' ? '.chapter-wrap{display:block;}' : '.chapter-wrap{display:block;}' } ${processed.css} </style>${processed.body}</div>`;chapterContent.innerHTML=html;chapterContent.style.display='block';chapterContent.style.background=bgColor;chapterContent.style.color=fontColor;overlay.classList.add('hidden');state.loaded=true;state.currentPage=0;requestAnimationFrame(()=>{updatePagination();setButtons();});statusEl.textContent=mode==='scroll'?'':mode==='page'?'':'')}
function pageDown(){if(mode==='scroll'){const step=Math.max(120,viewer.clientHeight*0.82);const max=chapterContent.scrollHeight-viewer.clientHeight;viewer.scrollTop=Math.min(max,viewer.scrollTop+step);if(viewer.scrollTop>=max-2&&chapterIndex<spine.length-1){chapterIndex++;renderChapter()}}else{if(state.currentPage<state.maxPages-1){state.currentPage++;scrollToPage(state.currentPage)}else if(chapterIndex<spine.length-1){chapterIndex++;renderChapter()}}}
function pageUp(){if(mode==='scroll'){const step=Math.max(120,viewer.clientHeight*0.82);if(viewer.scrollTop<=2){if(chapterIndex>0){chapterIndex--;renderChapter();setTimeout(()=>viewer.scrollTop=chapterContent.scrollHeight,50)}}else{viewer.scrollTop=Math.max(0,viewer.scrollTop-step)}}else{if(state.currentPage>0){state.currentPage--;scrollToPage(state.currentPage)}else if(chapterIndex>0){chapterIndex--;renderChapter()}}}
window.addEventListener('message',e=>{const d=e.data||{};if(d.type==='NEXT_CHAPTER'){if(chapterIndex<spine.length-1){chapterIndex++;renderChapter()}}else if(d.type==='PREV_CHAPTER'){if(chapterIndex>0){chapterIndex--;renderChapter()}}});
document.getElementById('file-picker').addEventListener('change',e=>{const file=e.target.files[0];if(file)loadBook(file)});
document.getElementById('lang-selector').addEventListener('change',e=>{currentLang=e.target.value;document.documentElement.setAttribute('lang',currentLang)});
document.getElementById('theme-toggle').addEventListener('click',()=>{darkMode=!darkMode;document.documentElement.setAttribute('data-theme',darkMode?'dark':'light');document.getElementById('theme-toggle').textContent=darkMode?'☀️ Light Mode':'🌙 Dark Mode';if(zip)renderChapter()});
document.getElementById('mode-toggle').addEventListener('click',()=>{mode=mode==='scroll'?'page':'scroll';document.getElementById('mode-toggle').textContent=mode==='scroll'?'Scroll Mode':'Page Mode';if(zip)renderChapter()});
document.getElementById('prev-btn').addEventListener('click',pageUp);
document.getElementById('next-btn').addEventListener('click',pageDown);
document.getElementById('focus-toggle').addEventListener('click',()=>{document.getElementById('main-header').classList.toggle('hidden');document.getElementById('sidebar').classList.toggle('hidden');document.getElementById('bottom-nav').classList.toggle('hidden')});
viewer.addEventListener('scroll',()=>{if(mode==='scroll'){const pageHeight=viewer.clientHeight-40;state.currentPage=Math.floor(viewer.scrollTop/pageHeight);updatePagination()}});
viewer.addEventListener('touchstart',e=>{const t=e.touches[0];state.touchStartX=t.clientX;state.touchStartY=t.clientY},{passive:true});
viewer.addEventListener('touchend',e=>{const t=e.changedTouches[0];const dx=t.clientX-state.touchStartX;const dy=t.clientY-state.touchStartY;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)){if(dx<0)pageDown();else pageUp();return;}const rect=viewer.getBoundingClientRect();const y=t.clientY-rect.top;if(y>rect.height*0.66)pageDown();else if(y<rect.height*0.33)pageUp();});
viewer.addEventListener('click',e=>{if(e.target.closest('a'))return;const rect=viewer.getBoundingClientRect();const y=e.clientY-rect.top;if(y>rect.height*0.66)pageDown();else if(y<rect.height*0.33)pageUp();});
window.addEventListener('resize',()=>{clearTimeout(state.resizeTimer);state.resizeTimer=setTimeout(()=>{if(zip)renderChapter()},120)});
document.documentElement.setAttribute('data-theme','light');
</script>
</body>
</html>
